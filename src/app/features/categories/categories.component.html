<div class="relative overflow-hidden bg-gradient-to-br from-[#16a34a] via-[#22c55e] to-[#4ade80] text-white">
    <div class="absolute top-0 right-0 -mt-20 -mr-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 -mb-20 -ml-20 w-64 h-64 bg-emerald-900/20 rounded-full blur-3xl"></div>

    <div class=" px-4 py-10 sm:py-16 relative z-10">
        <nav class="flex items-center gap-2 text-sm text-emerald-50 mb-8 flex-wrap">
            <a routerLink="/" class="cursor-pointer hover:text-white transition-colors flex items-center gap-1">
                <i class="fa-solid fa-house text-xs"></i> Home
            </a>
            <span class="text-white/40">/</span>
            <span class="text-white font-medium">All Categories</span>
        </nav>

        <div class="flex flex-col sm:flex-row items-center gap-6">
            <div
                class="w-20 h-20 rounded-3xl bg-white/20 backdrop-blur-md flex items-center justify-center shadow-2xl ring-1 ring-white/40 transform hover:rotate-6 transition-transform duration-300">
                <i class="fa-solid fa-box-open text-4xl text-white"></i>
            </div>

            <div class="text-center sm:text-left">
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-2">
                    All Categories
                </h1>
                <p class="text-emerald-50/90 text-lg font-light max-w-md">
                    Browse our wide range of product categories
                </p>
            </div>
        </div>
    </div>
</div>

<div class=" px-4 py-8">

    <div class="mt-5 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4  gap-4">
        @for (category of categoryList(); track category._id) {

        <a [routerLink]="['/category-details', category._id]"
            class="group block bg-white rounded-2xl border border-gray-100 p-4 shadow-sm hover:shadow-xl hover:border-emerald-200 transition-all duration-500 hover:-translate-y-2">

            <div class="relative aspect-square rounded-xl overflow-hidden bg-gray-50 mb-4 shadow-inner">
                <img [src]="category.image" [alt]="category.name"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-in-out">
                <div
                    class="absolute inset-0 bg-gradient-to-t from-emerald-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
            </div>

            <h3
                class="font-bold text-gray-800 text-center text-lg group-hover:text-emerald-600 transition-colors duration-300">
                {{ category.name }}
            </h3>

            <div class="flex justify-center mt-3 overflow-hidden">
                <span
                    class="text-xs font-semibold text-emerald-600 flex items-center gap-1.5 translate-y-8 group-hover:translate-y-0 transition-transform duration-300">
                    View Subcategories
                    <i class="fa-solid fa-arrow-right-long text-[10px]"></i>
                </span>
            </div>
        </a>
        }
    </div>

</div>
